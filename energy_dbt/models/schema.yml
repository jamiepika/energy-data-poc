version: 2

models:
  - name: stg_trades
    description: One row per trade, deduplicated, with signed volume.
    columns:
      - name: trade_id
        tests: [unique, not_null]
      - name: side
        tests:
          - accepted_values:
              arguments:
                values: ["BUY", "SELL"]
      - name: instrument
        tests:
          - relationships:
              arguments:
                to: ref('stg_prices')
                field: instrument

  - name: net_position
    description: Net MWh and value per desk and instrument.
    columns:
      - name: settle_price_eur
        tests: [not_null]
